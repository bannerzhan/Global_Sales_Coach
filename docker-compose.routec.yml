# ============================================================
# Route C 部署：IP 直连，HTTP(:3000) + 自签 HTTPS(:3443，语音用)
# 用法（服务器上）:
#   docker compose -f docker-compose.routec.yml up -d --build
# 访问:
#   http://82.157.183.237:3000   （明文，功能完整）
#   https://82.157.183.237:3443  （自签 HTTPS，语音录音需要；首次点「高级→继续访问」）
# 说明: 备案完成、绑域名后，改用 docker-compose.yml + deploy.sh <域名> 切自动 HTTPS。
# 注意: AUTH_USER_PASSWORD_HASH 在 .env 中必须写成 $$2b$$10$$...（compose 转义规则，
#       compose 插值后容器得到 $2b$10$...）；build 阶段经 build.args 直传（见 Dockerfile）。
# ============================================================
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gsc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gsc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsc_dev_password}
      POSTGRES_DB: gsc
    volumes:
      - gsc_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsc -d gsc"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        ARK_API_KEY: ${ARK_API_KEY:?请在 .env 中设置 ARK_API_KEY}
        ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
        ARK_ENDPOINT_PRO: ${ARK_ENDPOINT_PRO:?请在 .env 中设置 ARK_ENDPOINT_PRO}
        ARK_ENDPOINT_TURBO: ${ARK_ENDPOINT_TURBO:?请在 .env 中设置 ARK_ENDPOINT_TURBO}
        ARK_ENDPOINT_FLASH: ${ARK_ENDPOINT_FLASH:?请在 .env 中设置 ARK_ENDPOINT_FLASH}
        ARK_MODEL_FLASH: ${ARK_MODEL_FLASH:-deepseek-v4-flash}
        AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
        AUTH_USER_EMAIL: ${AUTH_USER_EMAIL:?请在 .env 中设置 AUTH_USER_EMAIL}
        AUTH_USER_PASSWORD_HASH: ${AUTH_USER_PASSWORD_HASH:?请在 .env 中设置 AUTH_USER_PASSWORD_HASH}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsc_dev_password}
        AUTH_URL: ${AUTH_URL:-https://82.157.183.237:3443}
        DATABASE_URL: postgresql://gsc:${POSTGRES_PASSWORD:-gsc_dev_password}@db:5432/gsc
        INVITE_CODE: ${INVITE_CODE:-gsc-invite-2026}
    container_name: gsc-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gsc:${POSTGRES_PASSWORD:-gsc_dev_password}@db:5432/gsc
      ARK_API_KEY: ${ARK_API_KEY:?请在 .env 中设置 ARK_API_KEY}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_ENDPOINT_PRO: ${ARK_ENDPOINT_PRO:?请在 .env 中设置 ARK_ENDPOINT_PRO}
      ARK_ENDPOINT_TURBO: ${ARK_ENDPOINT_TURBO:?请在 .env 中设置 ARK_ENDPOINT_TURBO}
      ARK_ENDPOINT_FLASH: ${ARK_ENDPOINT_FLASH:?请在 .env 中设置 ARK_ENDPOINT_FLASH}
      ARK_MODEL_FLASH: ${ARK_MODEL_FLASH:-deepseek-v4-flash}
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
      AUTH_USER_EMAIL: ${AUTH_USER_EMAIL:?请在 .env 中设置 AUTH_USER_EMAIL}
      AUTH_USER_PASSWORD_HASH: ${AUTH_USER_PASSWORD_HASH:?请在 .env 中设置 AUTH_USER_PASSWORD_HASH}
      AUTH_URL: ${AUTH_URL:-https://82.157.183.237:3443}
      # 运行时动态读取（voice.ts / register action 走 process.env 优先，免 rebuild 改配置）
      INVITE_CODE: ${INVITE_CODE:-gsc-invite-2026}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_ASR_RESOURCE_ID: ${VOICE_ASR_RESOURCE_ID:-volc.bigasr.auc_turbo}
      VOICE_TTS_RESOURCE_ID: ${VOICE_TTS_RESOURCE_ID:-seed-tts-2.0}
      VOICE_TTS_SPEAKER: ${VOICE_TTS_SPEAKER:-zh_female_gaolengyujie_uranus_bigtts}
    ports:
      - "3000:3000"

  voice-gateway:
    build:
      context: .
      dockerfile: voice-gateway/Dockerfile
    container_name: gsc-voice-gateway
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NODE_ENV: production
      VOICE_GATEWAY_PORT: 8787
      # 密钥后端存，前端不接触
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_ASR_RESOURCE_ID: ${VOICE_ASR_RESOURCE_ID:-volc.bigasr.sauc.async}
      VOICE_TTS_RESOURCE_ID: ${VOICE_TTS_RESOURCE_ID:-seed-tts-2.0}
      VOICE_TTS_SPEAKER: ${VOICE_TTS_SPEAKER:-en_female_dacey_uranus_bigtts}
      VOICE_APP_ID: ${VOICE_APP_ID:-}
      VOICE_CLUSTER: ${VOICE_CLUSTER:-}
      VOICE_LANG: ${VOICE_LANG:-en}
      ARK_API_KEY: ${ARK_API_KEY:?请在 .env 中设置 ARK_API_KEY}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_ENDPOINT_FLASH: ${ARK_ENDPOINT_FLASH:?请在 .env 中设置 ARK_ENDPOINT_FLASH}
      ARK_MODEL_FLASH: ${ARK_MODEL_FLASH:-deepseek-v4-flash}
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    container_name: gsc-caddy
    restart: unless-stopped
    depends_on:
      - app
      - voice-gateway
    ports:
      - "3443:443"
    volumes:
      - ./Caddyfile.selfsigned:/etc/caddy/Caddyfile:ro
      # 自签证书（服务器生成，见 deploy 说明；勿提交仓库）
      - ./selfsigned/selfsigned.crt:/etc/caddy/selfsigned.crt:ro
      - ./selfsigned/selfsigned.key:/etc/caddy/selfsigned.key:ro
      - gsc_caddy_data:/data
      - gsc_caddy_config:/config

volumes:
  gsc_pgdata:
  gsc_caddy_data:
  gsc_caddy_config:
